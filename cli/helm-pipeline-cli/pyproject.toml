[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helm-pipeline-cli"
version = "0.1.0"
description = "CI tooling for SpotINFO Helm chart validation and security scanning"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "pip-audit==2.9.0"]

[project.scripts]
chart-pipeline = "helm_pipeline.cli.chart_cli:main"
security-scan = "helm_pipeline.cli.security_cli:main"
tag-tests = "helm_pipeline.cli.tag_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/helm_pipeline"]
