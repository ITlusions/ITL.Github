name: Helm Publish — OCI (reusable)

# ---------------------------------------------------------------------------
# Reusable workflow: push a packaged Helm chart to an OCI registry
#
# Reuses the chart artifact produced by the Helm CI workflow for the same
# commit, so the published chart is the one that passed CI. The gate is per chart:
# the artifact exists only when that chart passed its own checks, and its security
# scan must have passed in the same run. Other charts in the run do not block it.
# fallback-build is an explicit opt-out.
#
# Usage:
#   jobs:
#     publish:
#       uses: ITlusions/ITL.Github/.github/workflows/_reusable-helm-publish.yml@main
#       with:
#         commit-sha: ${{ github.sha }}
#         chart-path: "charts/myapp"
#         environment: "production"
#         ci-workflow-name: "Helm CI — Branch push"
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      commit-sha:
        description: "Commit SHA whose CI run provides the chart artifact"
        required: true
        type: string
      chart-path:
        description: "Path to the chart directory (contains Chart.yaml), used when fallback-build runs"
        required: false
        type: string
        default: "."
      helm-version:
        description: "Helm version to install"
        required: false
        type: string
        default: "v4.3.2"
      registry:
        description: "OCI registry host to push to"
        required: false
        type: string
        default: "ghcr.io"
      registry-namespace:
        description: "Registry namespace; empty uses the repository owner (lowercased)"
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub environment that gates the publish job"
        required: false
        type: string
        default: "production"
      artifact-name:
        description: "Name of the chart artifact produced by the Helm CI workflow"
        required: false
        type: string
        default: "helm-chart"
      ci-workflow-name:
        description: "Display name of the CI workflow run to download the artifact from"
        required: false
        type: string
        default: "Helm CI — Branch push"
      fallback-build:
        description: "Build the chart from source when no CI artifact is found (bypasses the CI gate; avoid in production)"
        required: false
        type: boolean
        default: false

    secrets:
      gh-pat:
        description: "Token that may push chart release tags when the default token is restricted (optional)"
        required: false

    outputs:
      published:
        description: "true when the chart was pushed to the registry"
        value: ${{ jobs.publish.outputs.published }}
      package:
        description: "Name and version of the pushed chart package (name-version)"
        value: ${{ jobs.publish.outputs.package }}
      tag:
        description: "Release tag chart/<name>/v<version> created for a main-branch release (empty otherwise)"
        value: ${{ jobs.publish.outputs.tag }}

jobs:
  publish:
    name: Push chart to ${{ inputs.registry }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      published: ${{ steps.push.outputs.published }}
      package: ${{ steps.push.outputs.package }}
      tag: ${{ steps.push.outputs.tag }}

    steps:
      - name: Find CI run for commit
        id: find-run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          CI_WORKFLOW: ${{ inputs.ci-workflow-name }}
        run: |
          # Any completed run is accepted: a failing chart elsewhere in the run must not block this chart.
          run_id=$(gh run list --commit "$COMMIT_SHA" --workflow "$CI_WORKFLOW" \
            --status completed --limit 1 --json databaseId --jq '.[0].databaseId // ""')
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Require CI run
        if: steps.find-run.outputs.run-id == '' && !inputs.fallback-build
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          echo "No CI run found for $COMMIT_SHA; refusing to publish" >&2
          exit 1

      - name: Download chart artifact from CI run
        if: steps.find-run.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
          run-id: ${{ steps.find-run.outputs.run-id }}
          github-token: ${{ github.token }}

      # Full history and tags are needed to derive the version and to check for existing release tags.
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
          fetch-depth: 0

      # AI generated code: GitHub Copilot Claude Haiku 5.5
      # Runs after checkout so that the chart's .ciconfig at the published commit is available.
      - name: Require passing security scan for chart
        if: steps.find-run.outputs.run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.find-run.outputs.run-id }}
          CHART_PATH: ${{ inputs.chart-path }}
        run: |
          chart=$(basename "$CHART_PATH")
          config="$CHART_PATH/.ciconfig"
          # Only an explicit opt-out of both scanners skips the check; no scan job exists for such a chart.
          if [ -f "$config" ] \
            && grep -Eq '^trivy:[[:space:]]*false\b' "$config" \
            && grep -Eq '^kubescape:[[:space:]]*false\b' "$config"; then
            echo "Trivy and Kubescape are both disabled for $chart in .ciconfig; skipping the security scan check"
            exit 0
          fi
          conclusions=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
            --jq '.jobs[] | select(.name | endswith("Scan '"$chart"'")) | .conclusion')
          # Fails closed: a missing scan job is treated as not passed.
          if [ -z "$conclusions" ] || echo "$conclusions" | grep -qvx success; then
            echo "Security scan for $chart did not pass in run $RUN_ID; refusing to publish" >&2
            exit 1
          fi

      - name: Set up Helm
        if: steps.find-run.outputs.run-id == '' && inputs.fallback-build
        uses: azure/setup-helm@v5.1.0
        with:
          version: ${{ inputs.helm-version }}

      - name: Set up Python
        if: steps.find-run.outputs.run-id == '' && inputs.fallback-build
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install chart-pipeline
        if: steps.find-run.outputs.run-id == '' && inputs.fallback-build
        run: python -m pip install "helm-ci @ git+https://github.com/ITlusions/ITL.Github.git@main"

      - name: Determine chart version
        if: steps.find-run.outputs.run-id == '' && inputs.fallback-build
        id: version
        env:
          CHART: ${{ inputs.chart-path }}
        run: chart-pipeline next-version

      - name: Build chart from source
        if: steps.find-run.outputs.run-id == '' && inputs.fallback-build
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm dependency build "$CHART_PATH"
          helm package "$CHART_PATH" --version "$CHART_VERSION" --destination dist/

      - name: Log in to registry
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          helm registry login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin <<< "$GH_TOKEN"

      - name: Push chart
        id: push
        env:
          REGISTRY: ${{ inputs.registry }}
          NAMESPACE: ${{ inputs.registry-namespace }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GIT_REF: ${{ github.ref }}
        run: |
          packages=(dist/*.tgz)
          if [ ! -f "${packages[0]}" ]; then
            echo "No chart package found in dist/" >&2
            exit 1
          fi
          chart_name=$(helm show chart "${packages[0]}" | awk '/^name:/ {print $2}')
          chart_version=$(helm show chart "${packages[0]}" | awk '/^version:/ {print $2}')
          tag="chart/${chart_name}/v${chart_version}"
          # Main-branch releases get a tag; the tag must not exist yet so that a published version is never replaced.
          if [ "$GIT_REF" = "refs/heads/main" ]; then
            existing=$(git ls-remote --tags origin "refs/tags/$tag")
            if [ -n "$existing" ]; then
              echo "Tag $tag already exists; the chart version was not bumped" >&2
              exit 1
            fi
          fi
          namespace="${NAMESPACE:-$REPOSITORY_OWNER}"
          namespace="${namespace,,}"
          helm push "${packages[0]}" "oci://$REGISTRY/$namespace"
          echo "package=$(basename "${packages[0]}" .tgz)" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"
          if [ "$GIT_REF" = "refs/heads/main" ]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.tag != ''
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
          token: ${{ secrets.gh-pat || github.token }}

      - name: Create and push tag
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
