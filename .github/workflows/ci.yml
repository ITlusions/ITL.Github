name: CI

# ---------------------------------------------------------------------------
# CI pipeline for ITL.Github itself.
#
# Validates all composite actions (yamllint + actionlint) and auto-tags the
# repo on every merge to main so consumers can pin to a specific version:
#
#   uses: ITLusions/ITL.Github/actions/fire-release-dispatch@v1.2.3
#
# Branch strategy:
#   feature/**, hotfix/**, develop → validate + tag with the detect-version scheme
#                                    (e.g. v0.1.2-feature-login.42+abc1234)
#   main        → validate + patch tag + GitHub release
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keyed on SHA so push and pull_request runs for one commit dedupe, while every commit is tested.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # 1. Validate actions and workflows, and check markdown deadlinks — all branches
  # ---------------------------------------------------------------------------
  validate-actions:
    name: Validate actions and workflows
    uses: ./.github/workflows/_managed-validate-actions.yml

  check-deadlinks:
    name: Check markdown deadlinks
    uses: ./.github/workflows/_managed-check-deadlinks.yml

  # ---------------------------------------------------------------------------
  # Version tag: patch bump on main, prerelease tag on other branches
  #    Enables consumers to pin: @v1.2.3 or @v1
  # ---------------------------------------------------------------------------
  version:
    name: Version tag
    needs: [validate-actions, check-deadlinks]
    if: github.event_name == 'push'
    uses: ./.github/workflows/_managed-auto-tag.yml
    with:
      prerelease: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # GitHub release for whichever tag was created: patch tag on main, prerelease tag on branches
  # ---------------------------------------------------------------------------
  release:
    name: GitHub release
    needs: version
    if: needs.version.result == 'success' && needs.version.outputs.tag != ''
    uses: ./.github/workflows/_managed-release-gh.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      prerelease: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: write
      actions: read

  # ---------------------------------------------------------------------------
  # Floating tags on main (e.g. v1 → latest v1.x.x, latest → newest release)
  #    Allows consumers to pin to a major version: @v1, or to the newest release: @latest
  # ---------------------------------------------------------------------------
  tagging:
    name: Tagging
    needs: [version, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_managed-float-tags.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
