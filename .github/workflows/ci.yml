name: CI

# ---------------------------------------------------------------------------
# CI pipeline for ITL.Github itself.
#
# Validates all composite actions (yamllint + actionlint) and auto-tags the
# repo on every merge to main so consumers can pin to a specific version:
#
#   uses: ITLusions/ITL.Github/actions/fire-release-dispatch@v1.2.3
#
# Branch strategy:
#   feature/**, hotfix/**, develop → validate + tag with the detect-version scheme
#                                    (e.g. v0.1.2-feature-login.42+abc1234)
#   main        → validate + auto-tag (patch bump) + GitHub Release
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keyed on SHA so push and pull_request runs for one commit dedupe, while every commit is tested.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # 1. Validate actions and workflows, and check markdown deadlinks — all branches
  # ---------------------------------------------------------------------------
  validate:
    uses: ./.github/workflows/_reusable-validate-actions.yml

  check-deadlinks:
    uses: ./.github/workflows/_reusable-check-deadlinks.yml

  # ---------------------------------------------------------------------------
  # 2. Auto-tag (patch bump) — main only
  #    Enables consumers to pin: @v1.2.3 or @v1
  # ---------------------------------------------------------------------------
  auto-tag:
    name: Auto-tag
    needs: [validate, check-deadlinks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ITLusions/ITL.Github/.github/workflows/_reusable-auto-tag.yml@main
    with:
      commit-sha: ${{ github.sha }}

  # ---------------------------------------------------------------------------
  # 2b. Create GitHub Release for the new tag — main only
  # ---------------------------------------------------------------------------
  release:
    needs: auto-tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.auto-tag.outputs.tag != ''
    uses: ./.github/workflows/_reusable-release-gh.yml
    with:
      tag: ${{ needs.auto-tag.outputs.tag }}
    permissions:
      contents: write

  # ---------------------------------------------------------------------------
  # 2c. Tag and release non-main branches — existing tags are never moved
  # ---------------------------------------------------------------------------
  branch-tag:
    needs: [validate, check-deadlinks]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    uses: ./.github/workflows/_reusable-branch-tag.yml
    permissions:
      contents: write

  # ---------------------------------------------------------------------------
  # 3. Update floating tags — main only (e.g. v1 → latest v1.x.x, latest → newest release)
  #    Allows consumers to pin to a major version: @v1, or to the newest release: @latest
  # ---------------------------------------------------------------------------
  float-major-tag:
    needs: auto-tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_reusable-float-tags.yml
    with:
      tag: ${{ needs.auto-tag.outputs.tag }}
    permissions:
      contents: write
