name: Check markdown deadlinks (reusable)

# ---------------------------------------------------------------------------
# Reusable workflow: scan markdown files for dead links
#
# Usage:
#   jobs:
#     check-deadlinks:
#       uses: ./.github/workflows/_managed-check-deadlinks.yml
# ---------------------------------------------------------------------------
on:
  workflow_call:

jobs:
  check-deadlinks:
    name: Check markdown deadlinks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for deadlinks
        run: |
          python3 .github/scripts/check-md-deadlinks.py --output-format list
