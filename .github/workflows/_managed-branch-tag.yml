name: Branch tag and release (reusable)

# ---------------------------------------------------------------------------
# Reusable workflow: tag the current commit with a branch version (tag only, no release).
# Version scheme: v<base>-<branch-slug>.<run number>+<sha7>, where <base> is the latest release or
# baseversion from .metadata.json, whichever is higher. Existing tags are never moved.
#
# Usage:
#   jobs:
#     branch-tag:
#       uses: ./.github/workflows/_managed-branch-tag.yml
# ---------------------------------------------------------------------------
on:
  workflow_call:
    outputs:
      tag:
        description: "Branch tag that was created or already exists"
        value: ${{ jobs.branch-tag.outputs.tag }}

jobs:
  branch-tag:
    name: Branch tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create and push tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: "v"
          METADATA_FILE: ".metadata.json"
          BUMP: "false"
        run: |
          set -euo pipefail

          # Base version floor; defaults to 0.1.0 when the metadata file is absent
          if [ -f "$METADATA_FILE" ]; then
            BASE=$(jq -er '.baseversion' "$METADATA_FILE")
          else
            BASE="0.1.0"
          fi
          if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::baseversion '$BASE' in $METADATA_FILE is not X.Y.Z"
            exit 1
          fi

          # Latest published release (pre-releases and drafts are excluded by GitHub)
          if RELEASE_TAG=$(gh release view --json tagName --jq .tagName 2>/tmp/gh-release.err); then
            RELEASE="${RELEASE_TAG#"$PREFIX"}"
          elif grep -qiE "no releases found|not found" /tmp/gh-release.err; then
            RELEASE=""
          else
            cat /tmp/gh-release.err
            exit 1
          fi

          if [ -n "$RELEASE" ] && [[ ! "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::latest release '$RELEASE_TAG' is not a stable X.Y.Z version"
            exit 1
          fi

          # Highest of the base version and the latest release, without a patch bump
          HIGHEST="$BASE"
          if [ -n "$RELEASE" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$BASE" "$RELEASE" | sort -V | tail -n 1)
          fi

          if [ -n "$RELEASE" ] && [ "$HIGHEST" = "$RELEASE" ]; then
            CURRENT="$RELEASE"
          else
            CURRENT="$BASE"
          fi

          BRANCH_SLUG=$(echo "$GITHUB_REF_NAME" \
            | sed 's|/|-|g' \
            | sed 's/[^a-zA-Z0-9-]/-/g' \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/-\+/-/g' \
            | sed 's/^-//;s/-$//')
          TAG="${PREFIX}${CURRENT}-${BRANCH_SLUG}.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "baseversion: $BASE, release: ${RELEASE:-none}, tag: $TAG"

          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "Tag $TAG already exists; skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

