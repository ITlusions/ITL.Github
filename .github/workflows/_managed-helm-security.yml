name: Helm Chart Security (reusable)

# ---------------------------------------------------------------------------
# Reusable workflow: renders a Helm chart and scans its manifests and images with Trivy
#
# The chart is read from the caller repository (charts/<chart>) and the scan reports
# are uploaded as an artifact.
#
# Usage:
#   jobs:
#     chart-security:
#       uses: ITlusions/ITL.Github/.github/workflows/_managed-helm-security.yml@main
#       with:
#         chart: myapp
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      chart:
        description: "Chart directory name under charts/"
        required: true
        type: string
      summary-layout:
        description: "Job summary layout: classic, flat, sections, counts or expiry"
        type: string
        default: classic
      verify-exceptions:
        description: "Require a valid cosign signature bundle for each exception file (off by default)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.2

jobs:
  security:
    name: Scan ${{ inputs.chart }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install helm-pipeline-cli
        run: |
          python -m pip install "helm-pipeline-cli @ git+https://github.com/ITlusions/ITL.Github.git@main#subdirectory=cli/helm-pipeline-cli"

      - name: Name security artifact
        id: artifact
        env:
          CHART: ${{ inputs.chart }}
        run: echo "name=chart-security-$CHART" >> "$GITHUB_OUTPUT"

      - name: Install security tools
        run: security-scan setup-tools --directory dist/tools --tool trivy --tool kubescape

      - name: Install cosign
        if: inputs.verify-exceptions
        uses: sigstore/cosign-installer@v3

      - name: Scan chart
        env:
          CHART: ${{ inputs.chart }}
          SECURITY_SUMMARY_LAYOUT: ${{ inputs.summary-layout }}
          SECURITY_VERIFY_EXCEPTIONS: ${{ inputs.verify-exceptions && 'true' || 'false' }}
        run: security-scan chart "$CHART"

      - name: Store security reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/security/${{ inputs.chart }}
          if-no-files-found: ignore
