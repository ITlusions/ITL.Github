name: Python Publish PyPI - Reusable Template

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version'
        required: false
        default: '3.12'
        type: string
      testpypi_url:
        description: 'TestPyPI repository URL'
        required: false
        default: 'https://test.pypi.org/legacy/'
        type: string
      pypi_url:
        description: 'PyPI repository URL'
        required: false
        default: 'https://upload.pypi.org/legacy/'
        type: string

jobs:
  determine_target:
    name: Determine Publish Target
    runs-on: ubuntu-latest
    outputs:
      publish_to: ${{ steps.target.outputs.publish_to }}
      publish_reason: ${{ steps.target.outputs.publish_reason }}
    
    steps:
    - name: Check template version status
      run: |
        # Extract template version from workflow_ref (e.g., "...@v0.1.2")
        TEMPLATE_VERSION=$(echo "${{ github.workflow_ref }}" | grep -oP 'v\d+\.\d+\.\d+' | tail -1 || echo "unknown")
        
        # Fetch manifest from ITL.Github
        curl -s -L https://raw.githubusercontent.com/ITlusions/ITL.Github/main/.github/VERSION_MANIFEST.json -o /tmp/manifest.json || {
          echo "::debug::Could not fetch version manifest"
          exit 0
        }
        
        # Check if version is deprecated
        DEPRECATED=$(jq -r ".deprecated[] | select(.version==\"$TEMPLATE_VERSION\") | .reason" /tmp/manifest.json 2>/dev/null)
        if [[ ! -z "$DEPRECATED" ]]; then
          echo "::warning::Template version $TEMPLATE_VERSION is deprecated: $DEPRECATED"
          echo "::notice::Update to latest version by changing @$TEMPLATE_VERSION to @$(jq -r '.latest' /tmp/manifest.json)"
        fi
        
        # Check if newer version available
        LATEST=$(jq -r '.latest' /tmp/manifest.json 2>/dev/null)
        if [[ ! -z "$LATEST" && "$TEMPLATE_VERSION" != "$LATEST" && "$TEMPLATE_VERSION" != "unknown" ]]; then
          if ! echo "$TEMPLATE_VERSION" | grep -q "$(echo $LATEST | sed 's/v//')"; then
            echo "::notice::A newer template version is available: $LATEST (currently using $TEMPLATE_VERSION)"
          fi
        fi
    
    - name: Determine publish target
      id: target
      run: |
        BRANCH="${{ github.ref_name }}"
        TRIGGER="${{ github.event_name }}"
        MANUAL_TARGET="${{ github.event.inputs.publish_target }}"
        
        if [[ "$TRIGGER" == "release" ]]; then
          # GitHub Release event: use prerelease flag
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "publish_to=testpypi" >> $GITHUB_OUTPUT
            echo "publish_reason=GitHub Release (prerelease)" >> $GITHUB_OUTPUT
          else
            echo "publish_to=pypi" >> $GITHUB_OUTPUT
            echo "publish_reason=GitHub Release (stable)" >> $GITHUB_OUTPUT
          fi
        elif [[ "$TRIGGER" == "push" ]]; then
          # Automatic push: detect from branch
          if [[ "$BRANCH" == feature/* ]]; then
            echo "publish_to=testpypi" >> $GITHUB_OUTPUT
            echo "publish_reason=Automatic: feature branch ($BRANCH)" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == hotfix/* ]]; then
            echo "publish_to=pypi" >> $GITHUB_OUTPUT
            echo "publish_reason=Automatic: hotfix branch ($BRANCH)" >> $GITHUB_OUTPUT
          else
            echo "publish_to=none" >> $GITHUB_OUTPUT
            echo "publish_reason=Branch $BRANCH not configured for automatic publishing" >> $GITHUB_OUTPUT
          fi
        elif [[ "$MANUAL_TARGET" != "auto" && "$MANUAL_TARGET" != "" ]]; then
          # Manual workflow_dispatch with explicit target
          echo "publish_to=$MANUAL_TARGET" >> $GITHUB_OUTPUT
          echo "publish_reason=Manual override: $MANUAL_TARGET" >> $GITHUB_OUTPUT
        else
          # Manual workflow_dispatch with auto: detect from branch
          if [[ "$BRANCH" == feature/* ]]; then
            echo "publish_to=testpypi" >> $GITHUB_OUTPUT
            echo "publish_reason=Manual override (auto): feature branch ($BRANCH)" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == hotfix/* ]]; then
            echo "publish_to=pypi" >> $GITHUB_OUTPUT
            echo "publish_reason=Manual override (auto): hotfix branch ($BRANCH)" >> $GITHUB_OUTPUT
          else
            echo "publish_to=none" >> $GITHUB_OUTPUT
            echo "publish_reason=Branch $BRANCH not configured for publishing" >> $GITHUB_OUTPUT
          fi
        fi
  
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: determine_target
    if: needs.determine_target.outputs.publish_to != 'none'
    environment:
      name: pypi
    
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
    
    - name: Build distribution
      run: |
        python -m pip install --upgrade pip build
        python -m build
        ls -lah dist/
    
    - name: Publish to TestPyPI (prerelease)
      if: needs.determine_target.outputs.publish_to == 'testpypi'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: ${{ inputs.testpypi_url }}
        packages-dir: dist/
      continue-on-error: true
    
    - name: Publish to PyPI (stable)
      if: needs.determine_target.outputs.publish_to == 'pypi'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: ${{ inputs.pypi_url }}
        packages-dir: dist/
      continue-on-error: true
    
    - name: Publish result
      run: |
        TARGET="${{ needs.determine_target.outputs.publish_to }}"
        REASON="${{ needs.determine_target.outputs.publish_reason }}"
        
        if [[ "$TARGET" == "testpypi" ]]; then
          echo "Published to TestPyPI (Prerelease)"
          echo "Reason: $REASON"
        elif [[ "$TARGET" == "pypi" ]]; then
          echo "Published to PyPI (Stable)"
          echo "Reason: $REASON"
        else
          echo "Not published: $REASON"
        fi
