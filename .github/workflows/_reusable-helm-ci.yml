name: Helm CI — Chart (reusable)

# ---------------------------------------------------------------------------
# Reusable workflow: lint, render, validate and package a Helm chart
#
# The packaged chart is uploaded as an artifact so that the publish workflow
# can push exactly the chart that was tested.
#
# Usage:
#   jobs:
#     helm-ci:
#       uses: ITlusions/ITL.Github/.github/workflows/_reusable-helm-ci.yml@main
#       with:
#         chart-path: "charts/myapp"
#         values-files: |
#           charts/myapp/ci/default-values.yaml
#           charts/myapp/ci/ha-values.yaml
#
# Per-chart overrides can be placed in charts/<name>/.ciconfig (see the chart
# configuration docs). Settings in that file take precedence over the inputs above.
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      chart-path:
        description: "Path to the chart directory (contains Chart.yaml)"
        required: false
        type: string
        default: "."
      helm-version:
        description: "Helm version to install"
        required: false
        type: string
        default: "v4.3.2"
      values-files:
        description: "Newline-separated values files used when rendering the chart"
        required: false
        type: string
        default: ""
      kube-version:
        description: "Kubernetes version used for rendering and schema validation"
        required: false
        type: string
        default: "1.36.4"
      kubeconform:
        description: "Validate rendered manifests against Kubernetes JSON schemas"
        required: false
        type: boolean
        default: true
      artifact-name:
        description: "Name of the packaged chart artifact (consumed by the publish workflow)"
        required: false
        type: string
        default: "helm-chart"

jobs:
  # Reads the optional per-chart .ciconfig file. Unset settings are empty and fall back to the workflow inputs.
  config:
    name: Read chart configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      timeout-minutes: ${{ steps.config.outputs.timeout-minutes }}
      helm-version: ${{ steps.config.outputs.helm-version }}
      kube-version: ${{ steps.config.outputs.kube-version }}
      kubeconform: ${{ steps.config.outputs.kubeconform }}
      values-files: ${{ steps.config.outputs.values-files }}
      kind-test: ${{ steps.config.outputs.kind-test }}
      kind-scenarios: ${{ steps.config.outputs.kind-scenarios }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install chart-pipeline
        run: python -m pip install "helm-ci @ git+https://github.com/ITlusions/ITL.Github.git@main"

      - name: Read .ciconfig
        id: config
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        run: chart-pipeline chart-config "$CHART_PATH"

  lint:
    name: Lint and render
    runs-on: ubuntu-latest
    needs: config
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeout-minutes || '360') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: ${{ needs.config.outputs.helm-version || inputs.helm-version }}

      - name: Set up Python for chart-pipeline
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install chart-pipeline
        run: python -m pip install "helm-ci @ git+https://github.com/ITlusions/ITL.Github.git@main"

      # Fails when this chart's Chart.lock pins an older version of a local dependency, so the chart must be updated.
      - name: Check dependency locks
        run: chart-pipeline check-locks "$CHART_PATH"
        env:
          CHART_PATH: ${{ inputs.chart-path }}

      - name: Build chart dependencies
        run: helm dependency build "$CHART_PATH"
        env:
          CHART_PATH: ${{ inputs.chart-path }}

      - name: Lint chart
        run: helm lint --strict "$CHART_PATH"
        env:
          CHART_PATH: ${{ inputs.chart-path }}

      - name: Render chart
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          VALUES_FILES: ${{ needs.config.outputs.values-files || inputs.values-files }}
          KUBE_VERSION: ${{ needs.config.outputs.kube-version || inputs.kube-version }}
        run: |
          args=()
          while IFS= read -r file; do
            if [ -n "$file" ]; then args+=(-f "$file"); fi
          done <<< "$VALUES_FILES"
          helm template ci-release "$CHART_PATH" "${args[@]}" --kube-version "$KUBE_VERSION" > rendered.yaml
          echo "Rendered $(grep -c '^kind:' rendered.yaml) manifests"

      - name: Set up Python
        if: ${{ (needs.config.outputs.kubeconform || string(inputs.kubeconform)) == 'true' }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install kubeconform
        if: ${{ (needs.config.outputs.kubeconform || string(inputs.kubeconform)) == 'true' }}
        run: |
          python -m pip install "helm-ci @ git+https://github.com/ITlusions/ITL.Github.git@main"
          chart-pipeline setup-tools --directory dist/tools

      - name: Validate rendered manifests
        if: ${{ (needs.config.outputs.kubeconform || string(inputs.kubeconform)) == 'true' }}
        env:
          KUBE_VERSION: ${{ needs.config.outputs.kube-version || inputs.kube-version }}
        run: kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION" rendered.yaml

  # Disabled unless the chart sets kind-test in its .ciconfig file. Each scenario runs as its own matrix job,
  # with its own runner and kind cluster.
  kind-test:
    name: Install and test in kind (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: [config, lint]
    if: ${{ needs.config.outputs.kind-test == 'true' }}
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeout-minutes || '360') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.config.outputs.kind-scenarios) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: ${{ needs.config.outputs.helm-version || inputs.helm-version }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install kind and kubectl
        run: |
          python -m pip install "helm-ci @ git+https://github.com/ITlusions/ITL.Github.git@main"
          chart-pipeline setup-kind --directory dist/tools

      - name: Install and test chart scenario
        env:
          CHART: ${{ inputs.chart-path }}
          SCENARIO: ${{ matrix.scenario }}
          KUBE_VERSION: ${{ needs.config.outputs.kube-version || inputs.kube-version }}
        run: chart-pipeline kind-test

  # Only packages charts whose lint and kind checks passed, so the artifact exists only for a passing chart.
  # AI generated code: GitHub Copilot Claude Haiku 5.5
  package:
    name: Package chart
    runs-on: ubuntu-latest
    needs: [config, lint, kind-test]
    if: ${{ always() && needs.lint.result == 'success' && (needs.kind-test.result == 'success' || needs.kind-test.result == 'skipped') }}
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeout-minutes || '360') }}
    permissions:
      contents: read

    steps:
      # Full history and tags are needed so the version can be derived from the chart/<name>/v<x.y.z> tags.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: ${{ needs.config.outputs.helm-version || inputs.helm-version }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install chart-pipeline
        run: python -m pip install "helm-ci @ git+https://github.com/ITlusions/ITL.Github.git@main"

      - name: Determine chart version
        id: version
        env:
          CHART: ${{ inputs.chart-path }}
        run: chart-pipeline next-version

      - name: Build chart dependencies
        run: helm dependency build "$CHART_PATH"
        env:
          CHART_PATH: ${{ inputs.chart-path }}

      - name: Package chart
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: helm package "$CHART_PATH" --version "$CHART_VERSION" --destination dist/

      - name: Upload chart artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/*.tgz
          retention-days: 30
          if-no-files-found: error

