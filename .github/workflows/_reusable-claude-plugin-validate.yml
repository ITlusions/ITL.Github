name: Claude Plugin Validate (reusable)

# ---------------------------------------------------------------------------
# Reusable workflow: validate a Claude Code plugin or marketplace manifest
# via `claude plugin validate --strict`.
#
# Usage:
#   jobs:
#     validate:
#       uses: ITlusions/ITL.Github/.github/workflows/_reusable-claude-plugin-validate.yml@main
#       with:
#         path: "plugins/my-plugin"   # or "." for a marketplace root
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      path:
        description: "Path to a plugin directory, or '.' for a marketplace root"
        required: true
        type: string
      claude-code-version:
        description: "npm version spec for @anthropic-ai/claude-code"
        required: false
        type: string
        default: "latest"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@${{ inputs.claude-code-version }}

      - name: Validate
        run: claude plugin validate --strict "${{ inputs.path }}"
