name: Python CI - Reusable Template

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version'
        required: false
        default: '3.12'
        type: string
      test_import_path:
        description: 'Import path for import test'
        required: false
        default: 'itl_braincell_sdk.core.config'
        type: string
      test_import_class:
        description: 'Import class/module name for import test'
        required: false
        default: 'Settings'
        type: string
      src_directory:
        description: 'Source directory for linting'
        required: false
        default: 'src'
        type: string

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Check template version status
      run: |
        # Extract template version from workflow_ref (e.g., "...@v0.1.2")
        TEMPLATE_VERSION=$(echo "${{ github.workflow_ref }}" | grep -oP 'v\d+\.\d+\.\d+' | tail -1 || echo "unknown")
        
        # Fetch manifest from ITL.Github
        curl -s -L https://raw.githubusercontent.com/ITlusions/ITL.Github/main/.github/VERSION_MANIFEST.json -o /tmp/manifest.json || {
          echo "::debug::Could not fetch version manifest"
          exit 0
        }
        
        # Check if version is deprecated
        DEPRECATED=$(jq -r ".deprecated[] | select(.version==\"$TEMPLATE_VERSION\") | .reason" /tmp/manifest.json 2>/dev/null)
        if [[ ! -z "$DEPRECATED" ]]; then
          echo "::warning::Template version $TEMPLATE_VERSION is deprecated: $DEPRECATED"
          echo "::notice::Update to latest version by changing @$TEMPLATE_VERSION to @$(jq -r '.latest' /tmp/manifest.json)"
        fi
        
        # Check if newer version available
        LATEST=$(jq -r '.latest' /tmp/manifest.json 2>/dev/null)
        if [[ ! -z "$LATEST" && "$TEMPLATE_VERSION" != "$LATEST" && "$TEMPLATE_VERSION" != "unknown" ]]; then
          if ! echo "$TEMPLATE_VERSION" | grep -q "$(echo $LATEST | sed 's/v//')"; then
            echo "::notice::A newer template version is available: $LATEST (currently using $TEMPLATE_VERSION)"
          fi
        fi
    
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
    
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Test imports
      run: python -c "from ${{ inputs.test_import_path }} import ${{ inputs.test_import_class }}; print('Imports OK')"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
    
    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install black mypy ruff bandit
    
    - name: Format check
      run: black --check ${{ inputs.src_directory }} || true
    
    - name: Type check
      run: mypy ${{ inputs.src_directory }} --ignore-missing-imports || true
    
    - name: Security scan
      run: bandit -r ${{ inputs.src_directory }} || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ test, lint ]
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
    
    - name: Get version and branch info
      id: version
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        BRANCH="${{ github.ref_name }}"
        
        if [[ "$BRANCH" == "main" ]]; then
          ARTIFACT_NAME="wheel-${LATEST_TAG}"
        elif [[ "$BRANCH" == "develop" ]]; then
          ARTIFACT_NAME="wheel-${LATEST_TAG}-development"
        elif [[ "$BRANCH" == release/* ]]; then
          ARTIFACT_NAME="wheel-${LATEST_TAG}"
        else
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          ARTIFACT_NAME="wheel-${LATEST_TAG}-${BRANCH}-${SHORT_SHA}"
        fi
        
        echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
    
    - name: Build wheel
      run: |
        pip install --upgrade pip build
        python -m build
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.artifact_name }}
        path: dist/
        retention-days: 30
