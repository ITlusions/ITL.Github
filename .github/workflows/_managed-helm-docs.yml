name: Helm Example Docs — PR (reusable)

# ---------------------------------------------------------------------------
# Reusable workflow: regenerate the dependency section of one chart's example page
#
# Runs after a chart was released. Rewrites only that chart's section in its example
# page from Chart.yaml and Chart.lock at the released commit, and opens a pull request
# when the page changed. The narrative text on the page is left untouched.
#
# Usage:
#   jobs:
#     docs:
#       uses: ITlusions/ITL.Github/.github/workflows/_managed-helm-docs.yml@main
#       with:
#         commit-sha: ${{ github.event.workflow_run.head_sha }}
#         chart-path: "charts/myapp"
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      commit-sha:
        description: "Commit SHA of the released chart version"
        required: true
        type: string
      chart-path:
        description: "Chart directory, for example charts/myapp"
        required: true
        type: string
      docs-dir:
        description: "Folder with one example page per chart, named <chart>.md"
        required: false
        type: string
        default: "docs/voorbeelden"
      base-branch:
        description: "Branch the pull request targets"
        required: false
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  update:
    name: Update example page for ${{ inputs.chart-path }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install chart-pipeline
        run: python -m pip install "helm-ci @ git+https://github.com/ITlusions/ITL.Github.git@main"

      - name: Regenerate example page
        env:
          CHART: ${{ inputs.chart-path }}
          DOCS_DIR: ${{ inputs.docs-dir }}
        run: chart-pipeline docs-examples --docs-dir "$DOCS_DIR" "$CHART"

      - name: Open pull request when the page changed
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_PATH: ${{ inputs.chart-path }}
          DOCS_DIR: ${{ inputs.docs-dir }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          if git diff --quiet -- "$DOCS_DIR"; then
            echo "Example page is already current; no pull request"
            exit 0
          fi
          chart=$(basename "$CHART_PATH")
          version=$(python -c "import sys, yaml; print(yaml.safe_load(open(sys.argv[1], encoding='utf-8'))['version'])" "$CHART_PATH/Chart.yaml")
          branch="docs/examples/${chart}-${version}"
          title="docs: update $chart examples for $version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- "$DOCS_DIR/$chart.md"
          git commit -m "$title"
          # The branch is named after the released version and is owned by this workflow, so a rerun replaces it.
          git push --force origin "$branch"
          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Pull request for $branch already exists; the branch was updated"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$branch" \
              --title "$title" --body "Regenerated the dependency section of $chart from the released commit $COMMIT_SHA."
          fi
